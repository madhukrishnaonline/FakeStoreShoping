<div class="products d-flex flex-wrap overflow-auto">
    <div class="fetching" *ngIf="isFetching">Loading... <span class="spinner-border"></span></div>
    <div class="error" *ngIf="ErrorText">{{ErrorText}} try after some time</div>
    <div *ngFor="let products of womensClothing" class="card m-2 p-2">
        <div class="card-body">
            <div id="wishlist">
                <button class="btn btn-link" (click)="AddToWishList(products.id)">
                    <span class="bi bi-heart"></span>
                </button>
            </div>
            <img [src]="products.image" width="100%" height="250px" [alt]="products.title">
        </div>
        <div class="card-footer">
            <h4>{{products.title | slice:0:40}}</h4>
            <p>{{products.description | slice:0:40}}</p>
            <h4 class="text-primary mt-2"><span>Price</span> {{products.price | currency}}</h4>
            <div class="more">
                <a class="btn btn-primary mb-1" routerLink="/details/{{products.id}}/{{products.title}}">....more</a>
            </div>
            <div class="d-grid">
                <button class="btn btn-outline-danger" (click)="AddToCart(products.id)">
                    <span class="bi bi-cart"></span>Add To Cart
                </button>
            </div>
        </div>
    </div>
</div>
