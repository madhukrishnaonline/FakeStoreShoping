<div class="products d-flex flex-wrap overflow-auto">
    <div class="fetching" *ngIf="isFetching">Loading... <span class="spinner-border"></span></div>
    <div class="error" *ngIf="ErrorText">{{ErrorText}} try after some time</div>
    <div *ngFor="let products of womensClothing; trackBy: trackByProductId" class="card m-2 p-2 product-card" tabindex="0" (keydown)="onCardKeydown($event, products)">
        <div class="card-body">
                <div class="quick-actions">
                    <button class="btn btn-sm quick-btn" (click)="AddToCart(products.id)" aria-label="Add to cart"><span class="bi bi-cart"></span></button>
                    <button class="btn btn-sm quick-btn" (click)="AddToWishList(products.id)" aria-label="Toggle wishlist"><span [class]="isInWishlist(products.id) ? 'bi bi-heart-fill text-danger' : 'bi bi-heart'"></span></button>
                </div>
                <ng-container *ngIf="products.title; else skeleton">
                    <img [src]="products.image" width="100%" height="250px" [alt]="products.title">
                </ng-container>
                <ng-template #skeleton>
                    <div class="skeleton">
                        <div class="skeleton-img"></div>
                        <div class="skeleton-line" style="width:70%"></div>
                    </div>
                </ng-template>
        </div>
        <div class="card-footer">
            <h4>{{products.title | slice:0:40}}</h4>
            <p>{{products.description | slice:0:40}}</p>
            <h4 class="text-primary mt-2"><span>Price</span> {{products.price | currency}}</h4>
            <div class="more">
                <a class="btn btn-primary mb-1" routerLink="/details/{{products.id}}/{{products.title}}">....more</a>
            </div>
            <div class="d-grid">
                <button class="btn btn-outline-danger" (click)="AddToCart(products.id)">
                    <span class="bi bi-cart"></span>Add To Cart
                </button>
            </div>
        </div>
    </div>
</div>
