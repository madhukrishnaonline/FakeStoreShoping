<div class="products overflow-auto">
    <div class="fetching" *ngIf="isFetching">Loading... <span class="spinner-border"></span></div>
    <div class="error" *ngIf="ErrorText">{{ErrorText}} </div>
    <div class="row" *ngIf="!isFetching && !ErrorText">
        <div class="col-12">
            <!-- Carousel -->
            <div id="carouselExampleAutoplaying" class="carousel slide carousel-fade carousel-dark"
                data-bs-ride="carousel">
                <div class="carousel-indicators">
                    <button *ngFor="let ind of indicators; let idx = index" type="button"
                        data-bs-target="#carouselExampleAutoplaying" [attr.data-bs-slide-to]="idx"
                        [class.active]="idx === 0" [attr.aria-current]="idx === 0 ? 'true' : null"
                        [attr.aria-label]="'Slide ' + (idx + 1)">
                    </button>
                </div>
                <div class="carousel-inner" (mouseover)="slideFade==true">
                    <!-- active item -->
                    <div class="carousel-item active" data-bs-interval="1000">
                        <div id="carousel-c" class="card ms-2 me-4">
                            <div class="card-body d-block w-100">
                                <img src="/assets/t-shirt.png" width="100%" height="230px" alt="Stylish Black T-shirt">
                                <div class="carousel-caption d-none d-md-block">
                                    <h5>Stylish Black T-shirt</h5>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div *ngFor="let products of ReverseOrder">
                        <!--  -->
                        <div class="carousel-item" data-bs-interval="2000">
                            <div id="carousel-c" class="card ms-2 me-4">
                                <div class="card-body d-block w-100">
                                    <img [src]="products.image" width="100%" height="230px" [alt]="products.title">
                                    <div class="carousel-caption d-none d-md-block">
                                        <h5 class="text-bg-dark"><strong>{{products.title}}</strong></h5>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleAutoplaying"
                    data-bs-slide="prev">
                    <span class="carousel-control-prev-icon"></span>
                </button>
                <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleAutoplaying"
                    data-bs-slide="next">
                    <span class="carousel-control-next-icon"></span>
                </button>
            </div>
        </div>
    </div>
    <div class="d-flex flex-wrap mt-2">
        <div *ngFor="let products of Products; trackBy: trackByProductId" id="card" class="card m-2 p-2">
            <div class="card-body">
                <div id="wishlist"><button class="btn btn-link" (click)="AddToWishList(products.id)">
                        <span class="bi bi-heart"></span></button>
                </div>
                <img [src]="products.image" width="100%" height="250" [alt]="products.title">
            </div>
            <div class="card-footer">
                <h4>{{products.title | slice:0:35}}</h4>
                <p>{{products.description | slice:0:40}}</p>
                <h4 class="text-primary mt-2"><span>Price</span> {{products.price | currency}}</h4>
                <div class="more">
                    <a class="btn btn-primary mb-1"
                        routerLink="/details/{{products.id}}/{{products.title}}">....more</a>
                </div>
                <div class="d-grid">
                    <button type="button" class="btn btn-outline-danger" (click)="AddToCart(products.id)">
                        <span class="bi bi-cart"></span> Add To Cart
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
