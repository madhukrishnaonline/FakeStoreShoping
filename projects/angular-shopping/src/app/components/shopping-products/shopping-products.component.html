<div class="products overflow-auto" style="height: 650px;">
    <div class="fetching" *ngIf="isFetching">Loading... <span class="spinner-border"></span></div>
    <div class="error" *ngIf="ErrorText">{{ErrorText}} </div>
    <div class="row" *ngIf="!isFetching && !ErrorText">
        <div class="col-12">
            <!-- Carousel -->
            <div id="carouselExampleAutoplaying" class="carousel slide carousel-fade carousel-dark" data-bs-ride="carousel">
                <div class="carousel-indicators">
                    <button type="button" data-bs-target="#carouselExampleAutoplaying" data-bs-slide-to="0" class="active" aria-current="true" aria-label="Slide 1"></button>
                    <button type="button" data-bs-target="#carouselExampleAutoplaying" data-bs-slide-to="1" aria-current="true" aria-label="Slide 1"></button>
                    <button type="button" data-bs-target="#carouselExampleAutoplaying" data-bs-slide-to="2" aria-current="true" aria-label="Slide 1"></button>
                    <button type="button" data-bs-target="#carouselExampleAutoplaying" data-bs-slide-to="3" aria-current="true" aria-label="Slide 1"></button>
                    <button type="button" data-bs-target="#carouselExampleAutoplaying" data-bs-slide-to="4" aria-current="true" aria-label="Slide 1"></button>
                    <button type="button" data-bs-target="#carouselExampleAutoplaying" data-bs-slide-to="5" aria-current="true" aria-label="Slide 1"></button>
                    <button type="button" data-bs-target="#carouselExampleAutoplaying" data-bs-slide-to="6" aria-current="true" aria-label="Slide 1"></button>
                    <button type="button" data-bs-target="#carouselExampleAutoplaying" data-bs-slide-to="7" aria-current="true" aria-label="Slide 1"></button>
                    <button type="button" data-bs-target="#carouselExampleAutoplaying" data-bs-slide-to="8" aria-current="true" aria-label="Slide 1"></button>
                    <button type="button" data-bs-target="#carouselExampleAutoplaying" data-bs-slide-to="9" aria-current="true" aria-label="Slide 1"></button>
                    <button type="button" data-bs-target="#carouselExampleAutoplaying" data-bs-slide-to="10" aria-current="true" aria-label="Slide 1"></button>
                    <button type="button" data-bs-target="#carouselExampleAutoplaying" data-bs-slide-to="11" aria-current="true" aria-label="Slide 1"></button>
                    <button type="button" data-bs-target="#carouselExampleAutoplaying" data-bs-slide-to="12" aria-current="true" aria-label="Slide 1"></button>
                    <button type="button" data-bs-target="#carouselExampleAutoplaying" data-bs-slide-to="13" aria-current="true" aria-label="Slide 1"></button>
                    <button type="button" data-bs-target="#carouselExampleAutoplaying" data-bs-slide-to="14" aria-current="true" aria-label="Slide 1"></button>
                    <button type="button" data-bs-target="#carouselExampleAutoplaying" data-bs-slide-to="15" aria-current="true" aria-label="Slide 1"></button>
                    <button type="button" data-bs-target="#carouselExampleAutoplaying" data-bs-slide-to="16" aria-current="true" aria-label="Slide 1"></button>
                    <button type="button" data-bs-target="#carouselExampleAutoplaying" data-bs-slide-to="17" aria-current="true" aria-label="Slide 1"></button>
                    <button type="button" data-bs-target="#carouselExampleAutoplaying" data-bs-slide-to="18" aria-current="true" aria-label="Slide 1"></button>
                    <button type="button" data-bs-target="#carouselExampleAutoplaying" data-bs-slide-to="19" aria-current="true" aria-label="Slide 1"></button>
                    <button type="button" data-bs-target="#carouselExampleAutoplaying" data-bs-slide-to="20" aria-current="true" aria-label="Slide 1"></button>
                </div>
                <div class="carousel-inner" (mouseover)="slideFade==true">
                    <!-- active item -->
                    <div class="carousel-item active" data-bs-interval="1000">
                        <div id="carousel-c" class="card ms-2 me-4">
                            <div class="card-body d-block w-100">
                                <img src="/assets/t-shirt.png" width="100%" height="230px">
                                <div class="carousel-caption d-none d-md-block">
                                    <h5>Stylish Black T-shirt</h5>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div *ngFor="let products of ReverseOrder">
                        <!--  -->
                        <div class="carousel-item" data-bs-interval="2000">
                            <div id="carousel-c" class="card ms-2 me-4">
                                <div class="card-body d-block w-100">
                                    <img [src]="products.image" width="100%" height="230px">
                                    <div class="carousel-caption d-none d-md-block">
                                        <h5 class="text-bg-dark"><strong>{{products.title}}</strong></h5>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                <button class="carousel-control-prev" type="button" data-bs-target="#carouselExampleAutoplaying"
                    data-bs-slide="prev">
                    <span class="carousel-control-prev-icon"></span>
                </button>
                <button class="carousel-control-next" type="button" data-bs-target="#carouselExampleAutoplaying"
                    data-bs-slide="next">
                    <span class="carousel-control-next-icon"></span>
                </button>
            </div>
        </div>
    </div>
    <div class="d-flex flex-wrap mt-2">
        <div *ngFor="let products of Products" id="card" class="card m-2 p-2">
            <div class="card-body">
                <div id="wishlist"><button class="btn btn-link" (click)="AddToWishList(products.id)">
                        <span class="bi bi-heart"></span></button>
                </div>
                <img [src]="products.image" width="100%" height="250">
            </div>
            <div class="card-footer">
                <h4>{{products.title | slice:0:35}}</h4>
                <p>{{products.description | slice:0:40}}</p>
                <h4 class="text-primary mt-2"><span>Price</span> {{products.price | currency}}</h4>
                <div class="more">
                    <a class="btn btn-primary mb-1"
                        routerLink="/details/{{products.id}}/{{products.title}}">....more</a>
                </div>
                <div class="d-grid">
                    <button type="button" class="btn btn-outline-danger" (click)="AddToCart(products.id)">
                        <span class="bi bi-cart"></span> Add To Cart
                    </button>
                </div>
            </div>
        </div>
    </div>
</div>
