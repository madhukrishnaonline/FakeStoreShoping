<div class="products overflow-auto">
    <div class="fetching" *ngIf="isFetching">Loading... <span class="spinner-border"></span></div>
    <div class="error" *ngIf="ErrorText">{{ErrorText}} </div>
    <div class="row row-cols-1 row-cols-sm-2 row-cols-md-3 row-cols-lg-4 g-3 m-2">
        <div *ngFor="let products of Products; trackBy: trackByProductId" class="col">
            <div class="card h-100 product-card" [class.wishlisted]="isInWishlist(products.id)" tabindex="0" (keydown)="onCardKeydown($event, products)" [routerLink]="['/details', products.id, products.title]" data-tooltip="Click to see more">
                <div class="card-body d-flex flex-column">
                    <div class="quick-actions">
                        <button class="btn btn-sm quick-btn" (click)="$event.stopPropagation(); AddToCart(products.id)" aria-label="Add to cart"><span class="bi bi-cart"></span></button>
                        <button class="btn btn-sm quick-btn" (click)="$event.stopPropagation(); AddToWishList(products.id)" aria-label="Toggle wishlist"><span [class]="isInWishlist(products.id) ? 'bi bi-heart-fill text-danger' : 'bi bi-heart'"></span></button>
                    </div>
                    <ng-container *ngIf="products.title; else skeleton">
                        <img [src]="products.image" class="card-img-top product-card-img" [alt]="products.title">
                    </ng-container>
                    <ng-template #skeleton>
                        <div class="skeleton">
                            <div class="skeleton-img"></div>
                            <div class="skeleton-line" style="width:70%"></div>
                            <div class="skeleton-line" style="width:40%"></div>
                        </div>
                    </ng-template>
                </div>
                <div class="card-footer mt-auto">
                    <h4>{{ (products.title || '') | slice:0:35}}</h4>
                    <p>{{ (products.description || '') | slice:0:40}}</p>
                    <h4 class="text-primary mt-2"><span>Price</span> {{products.price | currency}}</h4>
                    <div class="d-grid">
                        <button type="button" class="btn btn-outline-danger" (click)="$event.stopPropagation(); AddToCart(products.id)">
                            <span class="bi bi-cart"></span> Add To Cart
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
